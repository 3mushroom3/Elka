# Развёртывание на сервере. Инструкция: docs/DEPLOY.md
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      ELKA_DB_PASSWORD: ${ELKA_DB_PASSWORD:?задайте ELKA_DB_PASSWORD в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elka -d elka"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://elka:${ELKA_DB_PASSWORD}@db:5432/elka
      APP_URL: https://${DOMAIN:?задайте DOMAIN в .env}
      SEED_ADMIN_LOGIN: ${ADMIN_LOGIN:-admin}
      SEED_ADMIN_PASSWORD: ${ADMIN_PASSWORD:?задайте ADMIN_PASSWORD в .env}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    volumes:
      - uploads:/app/uploads

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Ежедневная копия базы в папку ./backups, хранится 14 дней
  backup:
    image: postgres:17
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${ELKA_DB_PASSWORD}
    volumes:
      - ./backups:/backups
    entrypoint:
      - sh
      - -c
      - |
        while true; do
          pg_dump -h db -U elka elka | gzip > /backups/elka-$$(date +%F-%H%M).sql.gz
          find /backups -name 'elka-*.sql.gz' -mtime +14 -delete
          sleep 86400
        done

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
